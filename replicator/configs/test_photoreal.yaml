# test_photoreal.yaml — held-out SYNTHETIC TEST split (the domain-gap test).
#
# This is NOT drawn from the training distribution. Every domain knob below is shifted
# into a range the training splits never saw (brighter higher sun, brighter/smoother
# regolith, rougher terrain, a higher + wider + more downward camera) AND the rocks use
# deliberately different parameters (fewer, larger boulders). A model that only memorized
# the training appearance will degrade here; a domain-randomized model should hold up —
# that contrast is the sim-to-real lesson this dataset is built to show. Rendered at
# higher quality (more RTX subframes) so the test imagery is the cleanest of the three.
#
# mode: dr (still randomized — just over UNSEEN ranges). Count ranges are [lo, hi).

mode: dr
seed: 7777             # disjoint from the training seed -> independent draws
res: 512
rt_subframes: 12       # photoreal quality for the evaluation set

ranges:
  # --- Sun (UNSEEN: train was 5-40 deg / 9k-20k) ---
  sun_elevation_deg: [42, 70]       # higher sun than any training frame
  sun_azimuth_deg: [100, 260]       # rear/side hemisphere (keeps sun-hole out of frame)
  sun_intensity: [20000, 32000]     # brighter than any training frame

  # --- Regolith material (UNSEEN: train was 0.10-0.28 albedo / 0.85-0.99 rough) ---
  regolith_albedo: [0.28, 0.42]     # brighter highland regolith
  regolith_roughness: [0.70, 0.85]  # smoother than training

  # --- Terrain (UNSEEN: train was 2.0-4.8) ---
  terrain_amplitude: [4.8, 7.0]     # rougher relief
  crater_count: [10, 20]

  # --- Rocks (DIFFERENT params: fewer, larger) ---
  rock_count: [40, 90]
  rock_scale: [0.5, 2.2]            # larger far-field rocks
  near_rock_scale: [1.8, 4.0]       # larger near-field boulders
  near_rock_y: [-85, -50]
  embedding_depth_frac: [0.30, 0.55]

  # --- Camera (UNSEEN: train was h 1.5-2.7 / pitch -5..1.5 / fov 52-72) ---
  camera_height_m: [2.5, 3.6]
  camera_pitch_deg: [-9.0, -3.0]    # steeper down-look
  camera_fov_deg: [70, 85]          # wider lens

  # --- Sky ---
  star_count: [120, 260]
