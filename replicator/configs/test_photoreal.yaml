# test_photoreal.yaml — synthetic test split with photorealistic rendering settings
#
# Used to generate the held-out synthetic test set for eval/eval_synth.py.
# Higher rendering quality than training splits (more ray bounces, higher SPP).
# Domain randomization ON — same ranges as train_dr.yaml but different seed.

seed: 999  # different from training seed — ensures held-out distribution

# Sun — same ranges as train_dr
sun_elevation_deg: [5, 85]
sun_azimuth_deg: [0, 360]
sun_intensity: [50000, 150000]

# Regolith
regolith_albedo: [0.05, 0.20]

# Rocks
rock_count: [10, 80]
rock_scale: [0.05, 1.5]

# Camera
camera_fov_deg: [55, 85]
camera_pose_delta:
  translation_m: 0.1
  rotation_deg: 5.0

# Rendering — higher quality for test set
render:
  samples_per_pixel: 128    # vs 32 for training (faster) — TODO: tune in Task 2
  max_bounces: 8

# Output
output:
  types: [rgb, semantic_segmentation, instance, distance_to_camera]
  image_size: [1280, 720]
