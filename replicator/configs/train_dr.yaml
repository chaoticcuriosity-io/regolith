# train_dr.yaml — TRAINING split WITH domain randomization (the main training config).
#
# Wide randomization across lunar lighting, surface, geometry, and camera so a model
# trained here sees a broad slice of plausible appearances. Consumed by
# replicator/generate_dataset.py via replicator/randomizers.sample_params(rng, cfg):
# each frame draws a fresh value for every scalar knob and hands the *_count / *_scale
# ranges through to scene.build_lunar_stage (which varies them per-element/per-seed).
#
# Count ranges use numpy randint semantics: [lo, hi) — the upper bound is exclusive.

mode: dr
seed: 42
res: 512
rt_subframes: 3        # speed over polish for the training bulk

ranges:
  # --- Sun (domain) ---
  sun_elevation_deg: [5, 40]        # grazing to mid; long hard shadows
  sun_azimuth_deg: [100, 260]       # rear/side hemisphere (camera looks +Y / az~0);
                                    # keeps the sky-dome's sun-hole out of frame so
                                    # the camera never sees through to the void.
                                    # (back/side-lit shadows reach into the scene.)
  sun_intensity: [9000, 20000]

  # --- Regolith material (domain) ---
  regolith_albedo: [0.10, 0.28]     # dark basaltic to medium-bright highland
  regolith_roughness: [0.85, 0.99]

  # --- Terrain (domain/geometry) ---
  terrain_amplitude: [2.0, 4.8]     # primary fBm displacement (m)
  crater_count: [5, 13]             # -> 5..12 craters per frame

  # --- Rocks (geometry) ---
  rock_count: [70, 120]             # -> 70..119 rocks per frame
  rock_scale: [0.28, 1.35]          # far-field base scale (m)
  near_rock_scale: [1.1, 3.0]       # near-field boulder base scale (m)
  near_rock_y: [-80, -46]           # near-rock placement band ahead of camera (m)
  embedding_depth_frac: [0.22, 0.42]

  # --- Camera (domain) ---
  camera_height_m: [1.5, 2.7]
  camera_pitch_deg: [-5.0, 1.5]     # negative = look down
  camera_fov_deg: [52, 72]

  # --- Sky ---
  star_count: [160, 300]
